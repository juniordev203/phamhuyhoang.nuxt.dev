<style>
        body {
            background-color: theme('colors.background');
            background-image: linear-gradient(theme('colors.surface-container-highest') 1px, transparent 1px),
            linear-gradient(90deg, theme('colors.surface-container-highest') 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: center top;
        }
    </style>

<body class="min-h-screen flex flex-col text-on-background font-body-md selection:bg-primary selection:text-on-primary antialiased">
<!-- TopNavBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter py-4 max-w-container-max mx-auto bg-background/80 backdrop-blur-sm border-b border-primary">
<a class="text-headline-md font-headline-md font-bold tracking-tighter text-primary" href="#">ARCHITECT.DEV</a>
<nav class="hidden md:flex gap-8">
<a class="text-label-sm font-label-sm text-secondary hover:text-primary hover:line-through transition-all duration-200 cursor-pointer active:opacity-70" href="#">Work</a>
<a class="text-label-sm font-label-sm text-secondary hover:text-primary hover:line-through transition-all duration-200 cursor-pointer active:opacity-70" href="#">Tech</a>
<a class="text-label-sm font-label-sm text-primary underline decoration-2 underline-offset-8 hover:line-through transition-all duration-200 cursor-pointer active:opacity-70" href="#">Contact</a>
</nav>
<button class="hidden md:block bg-primary text-on-primary text-label-sm font-label-sm px-6 py-2 border border-primary hover:bg-background hover:text-primary transition-colors cursor-pointer active:opacity-70">Resume</button>
<button class="md:hidden text-primary cursor-pointer active:opacity-70">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[100px] pb-section-gap px-gutter max-w-container-max mx-auto w-full flex flex-col justify-center items-center">
<div class="w-full max-w-2xl mt-12 md:mt-24">
<div class="mb-16 text-center">
<h1 class="font-headline-xl text-headline-xl-mobile md:text-headline-xl text-primary mb-6">Let's build.</h1>
<p class="font-body-lg text-body-lg text-secondary max-w-lg mx-auto">
                    Currently accepting freelance opportunities for rigorous engineering projects.
                </p>
</div>
<!-- Contact Form -->
<form class="bg-surface-container-lowest border border-primary p-8 md:p-12 mb-16 shadow-none">
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-primary mb-2" for="name">Name</label>
<input class="bg-transparent border-0 border-b border-primary focus:ring-0 focus:border-b-2 focus:border-primary p-2 font-code-md text-code-md text-primary placeholder:text-outline outline-none rounded-none transition-all" id="name" name="name" placeholder="John Doe" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-primary mb-2" for="email">Email</label>
<input class="bg-transparent border-0 border-b border-primary focus:ring-0 focus:border-b-2 focus:border-primary p-2 font-code-md text-code-md text-primary placeholder:text-outline outline-none rounded-none transition-all" id="email" name="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col mb-12">
<label class="font-label-sm text-label-sm text-primary mb-2" for="message">Message</label>
<textarea class="bg-transparent border-0 border-b border-primary focus:ring-0 focus:border-b-2 focus:border-primary p-2 font-code-md text-code-md text-primary placeholder:text-outline outline-none rounded-none resize-none transition-all" id="message" name="message" placeholder="Project details..." rows="4"></textarea>
</div>
<button class="w-full bg-primary text-on-primary font-label-sm text-label-sm py-4 border border-primary hover:bg-surface-container-lowest hover:text-primary transition-colors duration-200" type="submit">
                    TRANSMIT MESSAGE
                </button>
</form>
<!-- Direct Links -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-6 text-center border-t border-outline-variant pt-12">
<a class="group flex flex-col items-center gap-2" href="#">
<span class="font-label-sm text-label-sm text-secondary group-hover:text-primary transition-colors uppercase tracking-widest">Email</span>
<span class="font-body-md text-body-md text-primary group-hover:underline">hello@architect.dev</span>
</a>
<a class="group flex flex-col items-center gap-2" href="#">
<span class="font-label-sm text-label-sm text-secondary group-hover:text-primary transition-colors uppercase tracking-widest">GitHub</span>
<span class="font-body-md text-body-md text-primary group-hover:underline">github.com/architect</span>
</a>
<a class="group flex flex-col items-center gap-2" href="#">
<span class="font-label-sm text-label-sm text-secondary group-hover:text-primary transition-colors uppercase tracking-widest">LinkedIn</span>
<span class="font-body-md text-body-md text-primary group-hover:underline">in/architectdev</span>
</a>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full px-gutter py-12 flex flex-col md:flex-row justify-between items-center gap-4 max-w-container-max mx-auto border-t border-primary mt-section-gap bg-background">
<div class="text-label-sm font-label-sm font-bold text-primary">
            ARCHITECT.DEV
        </div>
<div class="font-body-md text-body-md text-secondary text-center md:text-left">
            © 2024 ARCHITECT.DEV — ENGINEERED FOR PRECISION
        </div>
<div class="flex gap-6">
<a class="text-label-sm font-label-sm text-secondary hover:text-primary hover:line-through transition-colors duration-200" href="#">GitHub</a>
<a class="text-label-sm font-label-sm text-secondary hover:text-primary hover:line-through transition-colors duration-200" href="#">LinkedIn</a>
<a class="text-label-sm font-label-sm text-secondary hover:text-primary hover:line-through transition-colors duration-200" href="#">Source Code</a>
</div>
</footer>
</body></html>
